name: Auto-unblock issues

on:
  issues:
    types: [closed]

jobs:
  unblock:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const closedNum = context.payload.issue.number;
            console.log(`Issue #${closedNum} closed — checking for unblocked issues...`);

            // Fetch all open issues that still carry the 'blocked' label
            const blockedIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'blocked',
                per_page: 100,
              }
            );

            for (const issue of blockedIssues) {
              const body = issue.body || '';

              // Extract every "Issue #N" reference from the Dependensi section
              const depNumbers = [...body.matchAll(/Issue #(\d+)/g)]
                .map(m => parseInt(m[1]));

              if (!depNumbers.includes(closedNum)) continue;

              // Verify every dependency is now closed
              let allClosed = true;
              for (const depNum of depNumbers) {
                const { data: dep } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: depNum,
                });
                if (dep.state !== 'closed') {
                  allClosed = false;
                  break;
                }
              }

              if (allClosed) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: 'blocked',
                });
                console.log(`✓ Removed 'blocked' from issue #${issue.number}: ${issue.title}`);
              } else {
                console.log(`  Issue #${issue.number} still has unresolved dependencies, skipping.`);
              }
            }
